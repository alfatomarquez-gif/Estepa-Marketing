<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Estepa Marketing</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      position: relative;
      overflow: hidden;
    }

    .login-background {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .gradient-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.5;
      animation: float 20s ease-in-out infinite;
    }

    .gradient-blob-1 {
      width: 400px;
      height: 400px;
      background: rgba(246, 211, 101, 0.5);
      top: -100px;
      left: -100px;
      animation-delay: 0s;
    }

    .gradient-blob-2 {
      width: 500px;
      height: 500px;
      background: rgba(241, 39, 17, 0.4);
      bottom: -150px;
      right: -150px;
      animation-delay: 7s;
    }

    .gradient-blob-3 {
      width: 350px;
      height: 350px;
      background: rgba(0, 242, 254, 0.4);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: 14s;
    }

    @keyframes float {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }
      33% {
        transform: translate(30px, -30px) scale(1.1);
      }
      66% {
        transform: translate(-20px, 20px) scale(0.9);
      }
    }

    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 450px;
      padding: 20px;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 48px 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    [data-theme="dark"] .login-card {
      background: rgba(26, 26, 46, 0.95);
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .login-logo-icon {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 20px;
      font-family: var(--font-display);
    }

    .login-logo-text {
      font-size: 24px;
      font-weight: 700;
      font-family: var(--font-display);
      color: var(--text-primary);
    }

    .login-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0 0 8px 0;
      font-family: var(--font-heading);
    }

    .login-subtitle {
      font-size: 15px;
      color: var(--text-secondary);
      margin: 0;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid var(--gray-300);
      border-radius: 12px;
      font-size: 15px;
      font-family: var(--font-primary);
      transition: all 0.3s ease;
      background: var(--white);
      color: var(--text-primary);
      box-sizing: border-box;
    }

    [data-theme="dark"] .form-input {
      background: var(--dark-700);
      border-color: var(--dark-600);
      color: var(--white);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .form-input.error {
      border-color: var(--danger);
    }

    .form-error {
      display: none;
      color: var(--danger);
      font-size: 13px;
      margin-top: 6px;
    }

    .form-error.show {
      display: block;
    }

    .form-checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 20px 0;
    }

    .form-checkbox input {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .form-checkbox label {
      font-size: 14px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      font-family: var(--font-primary);
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-login .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }

    .btn-login.loading .btn-text {
      display: none;
    }

    .btn-login.loading .spinner {
      display: block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--gray-300);
    }

    [data-theme="dark"] .login-footer {
      border-top-color: var(--dark-600);
    }

    .login-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }

    .demo-credentials {
      background: rgba(102, 126, 234, 0.1);
      border: 1px solid rgba(102, 126, 234, 0.2);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 13px;
    }

    [data-theme="dark"] .demo-credentials {
      background: rgba(102, 126, 234, 0.2);
    }

    .demo-credentials-title {
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .demo-credentials-list {
      margin: 0;
      padding: 0;
      list-style: none;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .demo-credentials-list li {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
    }

    .demo-credentials-list strong {
      color: var(--text-primary);
    }

    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
      animation: slideDown 0.3s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .alert.show {
      display: block;
    }

    .alert-error {
      background: rgba(255, 71, 87, 0.1);
      border: 1px solid rgba(255, 71, 87, 0.3);
      color: var(--danger);
    }

    .alert-success {
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid rgba(0, 242, 254, 0.3);
      color: var(--success-dark);
    }

    @media (max-width: 768px) {
      .login-card {
        padding: 32px 24px;
      }

      .login-title {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="login-background">
    <div class="gradient-blob gradient-blob-1"></div>
    <div class="gradient-blob gradient-blob-2"></div>
    <div class="gradient-blob gradient-blob-3"></div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <div class="login-logo-icon">EM</div>
          <span class="login-logo-text">Estepa Marketing</span>
        </div>
        <h1 class="login-title">Panel de Administración</h1>
        <p class="login-subtitle">Ingresa tus credenciales para continuar</p>
      </div>

      <div class="demo-credentials">
        <div class="demo-credentials-title">
          <span>🔑</span>
          <span>Credenciales Demo</span>
        </div>
        <ul class="demo-credentials-list">
          <li><strong>Email:</strong> <span>admin@estepa.com</span></li>
          <li><strong>Password:</strong> <span>demo123</span></li>
        </ul>
      </div>

      <div id="alert" class="alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email" class="form-label">Correo Electrónico</label>
          <input 
            type="email" 
            id="email" 
            class="form-input" 
            placeholder="tu@email.com"
            required
            autocomplete="email"
          >
          <div class="form-error" id="emailError">Por favor ingresa un email válido</div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
          <div class="form-error" id="passwordError">La contraseña es requerida</div>
        </div>

        <div class="form-checkbox">
          <input type="checkbox" id="remember" name="remember">
          <label for="remember">Recordar mi sesión</label>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <span class="btn-text">Iniciar Sesión</span>
          <div class="spinner"></div>
        </button>
      </form>

      <div class="login-footer">
        <a href="../index.html">← Volver al inicio</a>
      </div>
    </div>
  </div>

  <script>
    // Login functionality
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;
      const loginBtn = document.getElementById('loginBtn');
      const alert = document.getElementById('alert');
      
      // Clear previous errors
      document.querySelectorAll('.form-input').forEach(input => {
        input.classList.remove('error');
      });
      document.querySelectorAll('.form-error').forEach(error => {
        error.classList.remove('show');
      });
      alert.classList.remove('show');
      
      // Basic validation
      let hasError = false;
      
      if (!email || !email.includes('@')) {
        document.getElementById('email').classList.add('error');
        document.getElementById('emailError').classList.add('show');
        hasError = true;
      }
      
      if (!password) {
        document.getElementById('password').classList.add('error');
        document.getElementById('passwordError').classList.add('show');
        hasError = true;
      }
      
      if (hasError) return;
      
      // Show loading state
      loginBtn.classList.add('loading');
      loginBtn.disabled = true;
      
      // Simulate API call delay
      await new Promise(resolve => setTimeout(resolve, 1000));
      
      // Demo authentication
      if (email === 'admin@estepa.com' && password === 'demo123') {
        // Success - Create session
        const sessionData = {
          user: {
            email: email,
            name: 'Admin Usuario',
            role: 'admin',
            avatar: null
          },
          loginTime: new Date().toISOString(),
          remember: remember
        };
        
        localStorage.setItem('estepa_admin_session', JSON.stringify(sessionData));
        
        // Show success message
        alert.textContent = '✓ Inicio de sesión exitoso. Redirigiendo...';
        alert.className = 'alert alert-success show';
        
        // Redirect to dashboard
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);
      } else {
        // Error - Invalid credentials
        loginBtn.classList.remove('loading');
        loginBtn.disabled = false;
        
        alert.textContent = '✕ Credenciales incorrectas. Por favor verifica tu email y contraseña.';
        alert.className = 'alert alert-error show';
        
        document.getElementById('email').classList.add('error');
        document.getElementById('password').classList.add('error');
      }
    });

    // Check if already logged in
    const session = localStorage.getItem('estepa_admin_session');
    if (session) {
      // Redirect to dashboard if already logged in
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
